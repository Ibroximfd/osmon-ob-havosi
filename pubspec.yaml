name: osmon_uzbekiston_ob_havosi
description: "Osmon - O'zbekiston ob-havo ilovasi"

publish_to: 'none' 



environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

 
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  dio: ^5.9.1
  get_it: ^9.2.1
  go_router: ^17.1.0
  shared_preferences: ^2.5.4
  lucide_icons: ^0.257.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  fl_chart: ^1.1.1
  google_maps_flutter: ^2.14.2
  google_fonts: ^8.0.2
  intl: ^0.20.2
  lottie: ^3.3.2
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  logger: ^2.6.2
  image_picker: ^1.2.1
  adaptive_theme: ^3.7.2
  easy_localization: ^3.0.8
  google_mobile_ads: ^7.0.0
  webview_flutter: ^4.13.1
  gal: ^2.3.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  package_info_plus: ^8.1.4
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

# lucide_icons 0.257.0 (latest on pub.dev) subclasses IconData, which
# Flutter made a `final class` — breaks compilation on current Flutter/Dart.
# Pinned to a local patched copy with the same API until upstream fixes it.
dependency_overrides:
  lucide_icons:
    path: packages/lucide_icons


flutter:


  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/



# ── App Launcher Icons ──────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/images/logo.png'
  min_sdk_android: 21
  web:
    generate: false

# ── Native Splash ───────────────────────────────────────────
flutter_native_splash:
  color: '#1565C0'
  image: assets/images/logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
