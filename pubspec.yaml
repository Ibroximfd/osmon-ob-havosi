name: osmon_uzbekiston_ob_havosi
description: "Osmon - O'zbekiston ob-havo ilovasi"

publish_to: 'none'

# The previous release was 2.0.1+6; the line was dropped in the last commit.
version: 2.0.5+12

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, architecture
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.1
  equatable: ^2.0.8
  dartz: ^0.10.1
  get_it: ^9.2.1
  go_router: ^17.1.0

  # Data
  dio: ^5.9.1
  shared_preferences: ^2.5.4
  intl: ^0.20.2

  # Location, astronomy
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  adhan: ^2.0.0+1

  # Map
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  vector_map_tiles: 9.0.0-beta.13
  vector_tile_renderer: ^6.1.0

  # Platform
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  workmanager: ^0.10.10
  home_widget: ^0.10.0
  image_picker: ^1.2.1
  gal: ^2.3.2
  permission_handler: ^12.0.1
  package_info_plus: ^8.1.4
  url_launcher: ^6.3.1
  google_mobile_ads: ^7.0.0

  # UI
  lucide_icons: ^0.257.0
  flutter_native_splash: ^2.4.7
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# lucide_icons 0.257.0 (latest on pub.dev) subclasses IconData, which
# Flutter made a `final class` — breaks compilation on current Flutter/Dart.
# Pinned to a local patched copy with the same API until upstream fixes it.
dependency_overrides:
  lucide_icons:
    path: packages/lucide_icons

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/map/

  fonts:
    - family: Geologica
      fonts:
        - asset: assets/fonts/Geologica.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf

# ── App Launcher Icons ──────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/images/app_icon.png'
  adaptive_icon_background: 'assets/images/app_icon_background.png'
  adaptive_icon_foreground: 'assets/images/app_icon_foreground.png'
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

# ── Native Splash ───────────────────────────────────────────
flutter_native_splash:
  color: '#071A2E'
  image: assets/images/splash_mark.png
  android_12:
    color: '#071A2E'
    image: assets/images/splash_mark.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
